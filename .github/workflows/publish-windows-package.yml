name: Publish Windows package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: editorx-windows-package

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: "1.4.0"

      - name: Publish the latest public Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          tag="$(jq -er '.tag_name' <<< "$release")"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern EditorX.exe --pattern THIRD-PARTY-NOTICES.txt
          jq -r '.assets[]
            | select(.name == "EditorX.exe" or .name == "THIRD-PARTY-NOTICES.txt")
            | "\(.digest | sub("^sha256:"; ""))  \(.name)"' <<< "$release" \
            | sha256sum --check -
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/LICENSE?ref=$tag" > LICENSE

          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          download_url="$source_url/releases/download/$tag/EditorX.exe"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:$tag,latest" \
            --artifact-type application/vnd.editorx.windows \
            --annotation "org.opencontainers.image.source=$source_url" \
            --annotation "org.opencontainers.image.url=$download_url" \
            --annotation "org.opencontainers.image.description=EditorX · Windows x64 文本编辑器" \
            --annotation "org.opencontainers.image.version=$tag" \
            EditorX.exe:application/octet-stream LICENSE:text/plain THIRD-PARTY-NOTICES.txt:text/plain
