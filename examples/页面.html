<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditorX · 本地 HTML 示例</title>
  <style>
    body { margin: 0; background: #f4f7fc; color: #17365d; font: 16px system-ui; }
    main { max-width: 640px; margin: 8vh auto; padding: 40px; background: white; border-radius: 24px; }
    img { width: 88px; height: 88px; }
    h1 { font-size: 32px; }
    p { line-height: 1.8; color: #607088; }
    button { padding: 12px 24px; border: 0; border-radius: 12px; background: #2c64b2; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/icon.png" alt="EditorX 黑蓝色图标">
    <h1>你好，HTML。</h1>
    <p>在 EditorX 当前标签内查看网页；修改源码后点击“刷新预览”。也可以切换为完整预览，或保存后在系统浏览器打开。相对路径图片、CSS 和 JavaScript 保留在原目录中。</p>
    <button id="hello">点击运行 JavaScript</button>
    <p id="result">等待点击。</p>
  </main>
  <script>
    let count = 0;
    document.getElementById("hello").onclick = () => {
      document.getElementById("result").textContent = `运行成功：第 ${++count} 次点击。`;
    };
  </script>
</body>
</html>
